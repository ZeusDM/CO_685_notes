name: Build and Release LaTeX Document

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/moderncv/debian-texlive-docker:main
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build PDF
        run: |
          latexmk -pdf notes.tex
          mv notes.pdf CO_685_notes.pdf

      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CO_685_notes.pdf
          path: CO_685_notes.pdf

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: The Mathematics of Public-Key Cryptography (CO 685) Lecture Notes
          files: CO_685_notes.pdf
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
